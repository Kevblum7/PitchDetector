[project]
name = "pitch-tip-detector"
version = "0.1.0"
description = "Local-first video analysis tool to detect potential MLB pitch tipping (research/coaching aid)."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sqlmodel>=0.0.14",
    # numpy < 2: has an Intel-mac wheel and matches torch 2.2.2's build (numpy 2.x
    # triggers a "Failed to initialize NumPy" warning from torch).
    "numpy<2",
    # torch 2.2.2 is the last release with x86_64 macOS (Intel) wheels;
    # torchvision 0.17.2 is its paired release. Keypoint R-CNN from torchvision
    # is the pose estimator: MediaPipe ships no Intel-mac wheel, so this is the
    # documented CPU-compatible fallback (CLAUDE.md §2).
    "torch==2.2.2",
    "torchvision==0.17.2",
    # Drawing pose overlays. (Also a torchvision dependency, declared explicitly
    # because we import PIL directly.) OpenCV is deliberately NOT a dependency:
    # no working Intel-mac wheel exists here (4.x is sdist-only and its source
    # build fails; 5.x needs numpy>=2 which breaks torch 2.2.2). Video decode/
    # encode goes through FFmpeg subprocess wrappers instead (CLAUDE.md §6).
    "pillow>=10",
]

[dependency-groups]
# Installed by default on `uv sync` (uv installs the `dev` group automatically).
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
pitch-diagnostics = "scripts.diagnostics:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend", "ml", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "models", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection markers are meant to be called in defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["backend", "ml", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project]
name = "tipfinder"
version = "0.1.0"
description = "Does a pitcher's pre-separation body language predict fastball vs. offspeed beyond game context?"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pybaseball>=2.2.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "requests>=2.32",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "opencv-python-headless>=4.9",
    "mediapipe>=0.10.14,<0.10.22",  # 0.10.x bundles pose models (no runtime model download)
    "typer>=0.12",
    "openai-agents>=0.2",
]

[project.scripts]
tipfinder = "tipfinder.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML", "types-requests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tipfinder"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["realdata: needs the local real-clip test cache (skipped if absent)"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
# Report template and LLM prompt: long literal lines read better unwrapped.
"src/tipfinder/report.py" = ["E501"]
"src/tipfinder/agent/scout.py" = ["E501"]
